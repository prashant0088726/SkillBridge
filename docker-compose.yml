services:

  backend:
    image: skillbridge-backend:latest
    container_name: skillbridge-backend

    ports:
      - "8080:8080"

    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:-SkillBridgeAiSuperSecretKeyForDevelopmentOnlyAtLeast256BitsLong2026!}

    restart: unless-stopped

  frontend:
    image: skillbridge-frontend:latest
    container_name: skillbridge-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped
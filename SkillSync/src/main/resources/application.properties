spring.application.name=SkillBridgeAI
server.port=${PORT:8080}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Database Configuration: Persistent File-Based H2 for local development
# AUTO_SERVER=TRUE allows multiple processes / tests to access the DB concurrently
spring.datasource.url=jdbc:h2:file:./data/skillbridge_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Google Gemini AI Configuration
# Set GEMINI_API_KEY in the environment; never commit API keys to this file.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}

spring.ai.google.genai.chat.model=gemini-3.8-flash

# JWT Security Configuration
skillbridge.jwt.secret=${JWT_SECRET:SkillBridgeAiSuperSecretKeyForDevelopmentOnlyAtLeast256BitsLong2026!}
# 7 days expiration (in milliseconds)
skillbridge.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}